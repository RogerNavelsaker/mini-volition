    "install": {
      "bun": {
        "pkg-path": "bun"
      },
      "canopy": {
        "flake": "github:RogerNavelsaker/nixpkg-canopy",
        "outputs": [
          "out",
          "cn"
        ]
      },
      "mulch": {
        "flake": "github:RogerNavelsaker/nixpkg-mulch",
        "outputs": [
          "out",
          "ml"
        ]
      },
      "seeds": {
        "flake": "github:RogerNavelsaker/nixpkg-seeds",
        "outputs": [
          "out",
          "sd"
        ]
      },
      "sqlite": {
        "pkg-path": "sqlite"
      },
      "trellis": {
        "flake": "github:RogerNavelsaker/nixpkg-trellis",
        "outputs": [
          "out",
          "tl"
        ]
      },
      "zellij": {
        "pkg-path": "zellij"
      }
    },
    "vars": {
      "WORKSPACE_META": "mini-volition",
      "WORKSPACE_OWNER": "RogerNavelsaker"
    },
    "hook": {
      "on-activate": "  export META_REPO_ROOT=\"$FLOX_ENV_PROJECT\"\n  export SHARED_WORKSPACE_ROOT=\"$FLOX_ENV_PROJECT\"\n\n  # PATH applies in all modes (interactive and `flox activate -- ...`).\n  # Aliases stay in [profile.common] because they only matter interactively.\n  export PATH=\"$META_REPO_ROOT/.flox/bin:$META_REPO_ROOT/bin:$META_REPO_ROOT/.llm/skills/coordinating-agents/bin:$PATH\"\n\n  # Bootstrap skill-local binaries (source + bin stay inside each skill dir).\n  _phloem_src=\"$META_REPO_ROOT/.llm/skills/coordinating-agents/main.ts\"\n  _phloem_build=\"$META_REPO_ROOT/.llm/skills/coordinating-agents/build.ts\"\n  _phloem_bin=\"$META_REPO_ROOT/.llm/skills/coordinating-agents/bin/phloem\"\n  _ph_bin=\"$META_REPO_ROOT/.llm/skills/coordinating-agents/bin/ph\"\n  if [ -f \"$_phloem_src\" ]; then\n    if [ ! -x \"$_phloem_bin\" ] \\\n       || [ ! -x \"$_ph_bin\" ] \\\n       || [ \"$_phloem_src\"   -nt \"$_phloem_bin\" ] \\\n       || [ \"$_phloem_build\" -nt \"$_phloem_bin\" ] \\\n       || [ \"$_phloem_build\" -nt \"$_ph_bin\" ]; then\n      echo \"[flox] building phloem...\" >&2\n      (cd \"$META_REPO_ROOT\" && bun run \"$_phloem_build\") \\\n        || echo \"[flox] phloem build failed (non-fatal; run build.ts manually)\" >&2\n    fi\n  fi\n  unset _phloem_src _phloem_build _phloem_bin _ph_bin\n"
    },
    "profile": {
      "common": "  alias fx=\"$META_REPO_ROOT/.flox/bin/fx\"\n  alias workspace-bootstrap=\"$META_REPO_ROOT/scripts/bootstrap\"\n  alias workspace-status=\"$META_REPO_ROOT/scripts/status\"\n"
    },
    "options": {
      "systems": [
        "x86_64-linux"
      ],
      "allow": {
        "unfree": true
      }
    }
  },
