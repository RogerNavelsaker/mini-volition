defaultRole: pi
defaultBranch: main
runBranchPrefix: warren
agentImage: ghcr.io/rogernavelsaker/warren-agent:latest

ciFixer:
  enabled: true
  maxRetries: 2
  cooldownMinutes: 10
  logTailLines: 200
  role: pr-fixer

healer:
  enabled: true
  maxRetries: 3
  cooldownMinutes: 30
  role: healer
  projectMapping:
    - '*'
