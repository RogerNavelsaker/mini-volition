objective: Support 'Raw-Mode' storage for recent memory tiers. The current ingest process summarizes artifacts immediately, which can lead to loss of granular detail (e.g., exact error messages or code snippets). Raw-mode will preserve the verbatim text for Tier 1 and Tier 2 artifacts, only triggering lossy summarization upon promotion to Tier 3 (Archival).
constraints:
  - Raw fragments must have a configurable retention period or character limit.
acceptance:
  - Working memory context includes exact verbatim snippets from the previous two turns.
