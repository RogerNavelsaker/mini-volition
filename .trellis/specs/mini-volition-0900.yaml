objective: "Implement proactive memory contradiction detection. The librarian will use a 'Smart-when-it-can, Deterministic-when-it-must' pattern: model-based heuristics (fleet-heavy) will propose likely conflicts between old and new facts, while exact invalidation rules (e.g., 'Status: Closed' vs 'Status: Open') will confirm the conflict. Confirming a contradiction triggers an automatic 'invalidate' action on the stale artifact."
constraints:
  - Conflicts must be flagged for agent review before final invalidation.
acceptance:
  - Librarian identifies and flags a conflict when two facts about 'Server IP' differ.
