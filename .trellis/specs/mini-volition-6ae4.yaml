objective: Implement canonical entity consolidation in the archival memory tier. When the librarian detects multiple facts or descriptions for the same entity (name + type match) across different episodic bursts, it must merge them into a single, high-fidelity canonical record. This reduces noise in retrieval and ensures the agent gets the 'latest known truth' about an entity.
constraints:
  - Merging must be non-destructive (keep provenance of original facts if possible).
  - Conflict resolution must use fleet-heavy inference if heuristics fail.
acceptance:
  - Archival queries return a single merged record for 'Project Volition' instead of three separate fragments.
