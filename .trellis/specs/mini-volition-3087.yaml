objective: Implement a protocol evolution mechanism. This allows agents to autonomously propose and vote on changes to the system's Fleet Protocols (stored in fleet.kdl). A proposal requires a majority vote from the active agent collective to be applied. This facilitates the 'emergent digital culture' described in the reference philosophy.
constraints:
  - Human operator must have final veto power on any protocol change.
acceptance:
  - Proposal 'Add randomized jitter to governor' is automatically applied after 3 agents vote 'yes'.
