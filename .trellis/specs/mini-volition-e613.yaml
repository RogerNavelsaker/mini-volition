objective: Implement an immutable, append-only Audit Log (The 'Black Box'). Every agent state transition (idle -> thinking -> working) and every cross-agent message must be cryptographically hashed and logged to a write-only store. This ensures a verifiable trail of autonomous decisions for forensic analysis and system debugging.
constraints:
  - The store must be separate from the volatile runtime databases.
acceptance:
  - Every AbeTurn entry corresponds to a verified hash in the audit log.
