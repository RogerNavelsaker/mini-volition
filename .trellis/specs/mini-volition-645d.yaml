objective: Implement autonomous self-repair and dynamic topology. The harness must track consecutive turn failures for an agent. If a threshold is reached, the harness can autonomously 'reclaim' the failed task and assign it to a different agent profile or request an operator to add capacity. This ensures system resilience without human intervention for transient agent crashes.
constraints:
  - Repair attempts must be limited to prevent infinite retry loops.
acceptance:
  - Job 123 is automatically moved from Abe-01 (failing) to Abe-02 (idle) after 3 crashes.
