objective: Implement the 'Focus' protocol for deep work. When an agent enters a focus state (via a typed action), the harness will temporarily unsubscribe from all non-emergency layers. The agent must specify a duration or a task-completion trigger for the focus period. Once complete, the harness automatically restores the previous subscription state.
constraints:
  - Synchronous (emergency) channels must ALWAYS remain active.
acceptance:
  - "Agent successfully silences chat:general for 1 hour while working on a critical job."
