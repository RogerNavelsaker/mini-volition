updatedAt: "2026-04-15T17:41:06.863Z"
objective: Transform the fleet-digest service into a strictly reactive event-driven router. Instead of polling every 2 seconds, the service will wait for a 'BURST_FLUSHED' signal from the mail service. This signal will include the IDs of the messages in the burst, allowing the digest worker to immediately synthesize and store the episodic record.
constraints:
  - Must implement a 'dead-letter' cleanup poller for missed signals (e.g., every 5 minutes).
acceptance:
  - Digests are created and stored within 500ms of a burst completion.
