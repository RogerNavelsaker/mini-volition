title: Richer job semantics
seed: mini-volition-a19e
status: active
createdAt: "2026-04-15T12:43:14.668Z"
updatedAt: "2026-04-17T15:14:41.565Z"
objective: "Extend job system. Support complex graphs: jobs declare dependencies. Add unblock policies. Add lifecycle actions: reschedule (exp backoff), cancel (manual/policy)."
constraints:
  - Circular dependencies must be detected and rejected at queue-time.
  - Job state transitions must be logged to the audit log.
acceptance:
  - A job correctly waits in 'blocked' state until its dependency is 'closed'.
  - Operator views show the depth and bread of the job dependency tree.
  - Cancellation of a parent job correctly handles descendant jobs (cascade or orphan).
