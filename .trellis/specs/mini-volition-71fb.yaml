id: mini-volition-71fb
title: Proactive context loading
seed: mini-volition-71fb
status: active
createdAt: "2026-04-15T12:43:36.788Z"
updatedAt: "2026-04-15T17:34:55.060Z"
objective: Implement a proactive memory pre-fetcher. The harness will monitor the 'current_task' field in the agent state. When the task changes (or at a regular interval), the librarian will pre-retrieve relevant facts and entities into a 'hot' local cache. This eliminates the latency of the first RAG lookup when a message burst actually arrives.
constraints:
  - Pre-fetch must be non-blocking and happen in the background.
acceptance:
  - First turn after a task change shows 'cache_hit' for relevant memory artifacts.
