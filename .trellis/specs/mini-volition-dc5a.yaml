status: active
createdAt: "2026-04-15T12:44:01.203Z"
updatedAt: "2026-04-15T17:41:32.723Z"
objective: Refine escalation severity and routing. The model will suggest a target channel and urgency level, but a deterministic governance policy will enforce floor and ceiling rules (e.g., 'Private' escalations ALWAYS route to the operator; 'Normal' escalations never bypass the team channel). This ensures autonomous agents cannot accidentally leak private data or ignore critical system failures.
constraints:
  - Routing policies must be hardcoded in fleet.kdl.
acceptance:
  - An agent request for 'Public Urgent' escalation is capped to 'Private Urgent' if the task context is sensitive.
